services:
  palace-workbench:
    image: ghcr.io/dangione/palace-workbench:latest-cuda
    ports:
      - "6080:6080"
      - "5901:5901"
    volumes:
      - ./projects:/projects
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
