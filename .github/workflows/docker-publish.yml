name: Build and push Docker image

on:
  push:
    branches: ["main", "dev"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      build_cuda:
        description: "Also build and push the GPU (CUDA) image variant"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/palace-workbench

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Explicit false to preserve pre-v7 publish behavior unchanged by
          # this action-version bump — v7 defaults to emitting build
          # provenance/attestation manifests, which older Docker clients
          # pulling from GHCR may not handle the same way.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # GPU (CUDA) IMAGE — MANUAL TRIGGER ONLY, TEMPORARY.
  # This is gated behind workflow_dispatch + build_cuda because it is not yet
  # validated on real GPU hardware (CI runners have no GPU; only compiles,
  # never runs). Once proven working against real NVIDIA hardware, REMOVE
  # this gate and move this job onto the same push/tag triggers as
  # build-and-push above, so the CUDA image builds automatically like the
  # CPU image does.
  #
  # To dispatch: run this workflow manually with build_cuda checked, targeting
  # the "main" branch/ref specifically — the raw `latest-cuda` tag (matching
  # the CPU image's `latest` behavior) only gets produced when github.ref is
  # refs/heads/main, same rule as the CPU job's own `latest` tag below.
  #
  # Real-hardware validation update (2026-09): order-1 GPU runs and cuDSS
  # (Solver.Linear.Type="cuDSS") both confirmed working end-to-end on real
  # NVIDIA hardware — see CLAUDE.md's "NVIDIA cuDSS sparse direct solver"
  # entry. This is NOT the "proven working" signal to remove the gate on,
  # though: the same build was also found to deadlock on ANY multi-rank CPU
  # run (mpirun -n 2+, even with Device=CPU) — confirmed via live backtrace
  # stuck in hypre_ParCSRCommPkgCreateApart/hypre_DataExchangeList, and
  # confirmed NOT reproducing on the plain (this job's) CPU image built from
  # the same host/Open MPI version. Root cause not fully pinned down (leading
  # suspect: this build's HYPRE_USING_CUDA/HYPRE_USING_DEVICE_MEMORY hypre
  # compile flags change how hypre allocates its MPI communication buffers,
  # even on a CPU-only run) — full writeup in CLAUDE.md's "Multi-rank CPU is
  # broken in the CUDA-enabled build" entry. Also unaffected either way: FE
  # order >= 2 on GPU still SIGFPEs (see CLAUDE.md's "GPU runs SIGFPE at FE
  # order >= 2" entry), deliberately left unpatched. Net effect: this image
  # is single-rank-only in practice (GPU order-1 work and cuDSS only), not a
  # general-purpose drop-in for the CPU image above. Before removing this
  # gate, either fix the multi-rank hang or make sure downstream users of
  # this tag understand the single-rank limitation — don't just promote it
  # to the automatic push/tag path because the compile+smoke-test now works.
  # ============================================================================
  build-and-push-cuda:
    # Compared with `== 'true'` rather than used bare: workflow_dispatch
    # boolean inputs triggered via the GitHub CLI/REST API (not the web UI
    # form) can arrive as the literal string "false", which is truthy in a
    # bare GitHub Actions expression — this comparison is correct for both a
    # real boolean and a "true"/"false" string either way.
    if: github.event_name == 'workflow_dispatch' && inputs.build_cuda == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-cuda,onlatest=true
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push CUDA Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          build-args: |
            BASE_IMAGE=nvidia/cuda:12.8.1-devel-ubuntu22.04
            PALACE_WITH_CUDA=ON
          cache-from: type=gha,scope=cuda
          # mode=min (the default), not mode=max like the CPU job: this build
          # compiles 8 CUDA architectures from a much larger -devel base, so a
          # mode=max cache-to here would write a disproportionately large
          # amount into the single, repo-wide 10 GB GHA cache (LRU-evicted,
          # not a separate quota per scope=) — risking evicting the CPU job's
          # cache even though the CPU job runs far more often (every push).
          cache-to: type=gha,scope=cuda
