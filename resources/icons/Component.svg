<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dashed bounding box: an assembly of several tagged solids bundled as one unit -->
  <rect x="4" y="4" width="56" height="56" rx="6" fill="none" stroke="#616161" stroke-width="2.5" stroke-dasharray="5,4"/>
  <!-- Conductor solid (copper) -->
  <rect x="12" y="12" width="20" height="18" rx="2" fill="#B87333"/>
  <!-- Dielectric solid (green) -->
  <rect x="34" y="14" width="18" height="16" rx="2" fill="#4CAF50" fill-opacity="0.75"/>
  <!-- Second conductor solid -->
  <rect x="14" y="36" width="16" height="16" rx="2" fill="#B87333"/>
  <!-- Second dielectric solid -->
  <rect x="34" y="36" width="18" height="16" rx="2" fill="#4CAF50" fill-opacity="0.75"/>
</svg>
