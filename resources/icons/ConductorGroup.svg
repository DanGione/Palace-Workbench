<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Metal block -->
  <rect x="4" y="10" width="56" height="44" rx="5" fill="#FFB300" stroke="#E65100" stroke-width="2.5"/>
  <!-- Cross-hatch (engineering convention for metal in section) -->
  <clipPath id="c"><rect x="4" y="10" width="56" height="44" rx="5"/></clipPath>
  <g clip-path="url(#c)" stroke="#E65100" stroke-width="1.5" opacity="0.55">
    <line x1="-4" y1="28" x2="28" y2="60"/><line x1="8"  y1="10" x2="48" y2="60"/>
    <line x1="24" y1="10" x2="64" y2="60"/><line x1="40" y1="10" x2="68" y2="52"/>
  </g>
  <!-- PEC label -->
  <text x="32" y="41" font-family="Arial,sans-serif" font-size="15" font-weight="bold"
        fill="white" text-anchor="middle" stroke="#B45100" stroke-width="0.5">PEC</text>
</svg>
