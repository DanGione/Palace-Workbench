<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Isometric box outline, dashed to suggest transparent airbox -->
  <!-- Top face -->
  <polygon points="32,4 58,18 32,32 6,18" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"
           stroke-dasharray="5,3"/>
  <!-- Left face -->
  <polygon points="6,18 32,32 32,58 6,44" fill="#BBDEFB" stroke="#1565C0" stroke-width="2.5"
           stroke-dasharray="5,3"/>
  <!-- Right face -->
  <polygon points="58,18 32,32 32,58 58,44" fill="#90CAF9" stroke="#1565C0" stroke-width="2.5"
           stroke-dasharray="5,3"/>
</svg>
